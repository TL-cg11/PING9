# main에 들어온 커밋을 검사한 뒤 Vercel 운영에 배포한다 (T1.1.3).
#
# Vercel의 Git 연동은 Hobby 플랜에서 저장소 소유자가 아닌 사람의 커밋을 배포하지 않는다
# (docs/task-logs/T0.1-repo-and-deploy-setup.md의 V2). 여기서는 Vercel 토큰으로 배포하므로
# 누가 커밋했든 main에 들어오면 배포된다.
#
# 비밀값은 GitHub 환경 `production`에만 있고, 그 환경은 main 브랜치에서만 쓸 수 있다 (SEC-27).
#   secrets.VERCEL_TOKEN      저장소 소유자가 등록
#   vars.VERCEL_ORG_ID        Vercel 팀 ID
#   vars.VERCEL_PROJECT_ID    Vercel 프로젝트 ID
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 배포는 한 번에 하나만. 진행 중인 배포를 끊지 않는다
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  production:
    name: production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://ping9.vercel.app
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_CLI: vercel@65.11.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Scan for secrets
        run: node scripts/check-secrets.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      # 검사를 통과한 코드만 배포한다
      - name: Lint, typecheck, test, build
        run: pnpm check

      - name: Skip deploy when the Vercel token is not registered
        if: env.VERCEL_TOKEN == ''
        run: echo "::warning title=배포 건너뜀::환경 production에 VERCEL_TOKEN이 없어 배포하지 않았습니다. docs/task-logs/T1.1.3-ci-and-deploy.md의 7절을 보세요."

      - name: Pull Vercel project settings
        if: env.VERCEL_TOKEN != ''
        run: pnpm dlx "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build for Vercel
        if: env.VERCEL_TOKEN != ''
        run: pnpm dlx "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to production
        if: env.VERCEL_TOKEN != ''
        run: pnpm dlx "$VERCEL_CLI" deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Verify the production URL responds
        if: env.VERCEL_TOKEN != ''
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" https://ping9.vercel.app/)
          echo "https://ping9.vercel.app/ -> $status"
          test "$status" = "200"
