# Pull Request마다, 그리고 main에 커밋이 들어올 때마다 실행하는 검사 (T1.1.3, T0.4).
# 이 워크플로는 비밀값을 쓰지 않는다 (SEC-27).
# 배포는 여기서 하지 않는다. Vercel의 Git 연동이 한다 (docs/task-logs/T0.4-public-repo-and-git-deploy.md).
# 외부 액션은 태그가 아니라 커밋 해시로 고정한다 (SEC-27).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # 의존성을 설치하기 전에 먼저 본다. PR에서는 이 PR의 커밋이 추가한 줄도 검사한다 (SEC-19)
      # main에 들어온 커밋에서는 기준 브랜치가 없으므로 추적 중인 파일만 검사한다
      # 브랜치 이름은 환경 변수로 넘긴다. 명령에 바로 끼워 넣으면 이름에 든 글자가 명령으로 실행될 수 있다
      - name: Scan for secrets
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            node scripts/check-secrets.mjs --range "origin/$BASE_REF..HEAD"
          else
            node scripts/check-secrets.mjs
          fi

      # 잠금 파일 그대로 설치하고 설치 스크립트를 끈다 (SEC-27)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # 높은 등급 이상의 취약점이 있으면 실패 (SEC-20)
      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
